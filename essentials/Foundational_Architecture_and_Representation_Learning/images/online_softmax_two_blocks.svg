<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8b8b0"/>
    </marker>
  </defs>
  <rect width="820" height="372" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">Online softmax gets the exact sum without holding the whole row</text>
  <text x="20" y="47" font-size="11.5" fill="#666">One row of scores [1, 2, 3, 4], processed in two blocks. Only m and ℓ are carried from one block to the next.</text>

  <rect x="110" y="66" width="600" height="74" rx="7" fill="#fff" stroke="#c8c8c0"/>
  <text x="126" y="88" font-size="12.5" font-weight="700" fill="#1f2328">Block 1: scores [1, 2]</text>
  <text x="126" y="108" font-size="12" fill="#1f2328">running max m = 2</text>
  <text x="126" y="126" font-size="12" fill="#1f2328">running sum ℓ = e⁽¹⁻²⁾ + e⁽²⁻²⁾ = 0.368 + 1 = 1.368</text>

  <line x1="410" y1="140" x2="410" y2="166" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="422" y="158" font-size="11.5" fill="#555">carry m = 2, ℓ = 1.368</text>

  <rect x="110" y="170" width="600" height="92" rx="7" fill="#fff" stroke="#c8c8c0"/>
  <text x="126" y="192" font-size="12.5" font-weight="700" fill="#1f2328">Block 2: scores [3, 4]</text>
  <text x="126" y="212" font-size="12" fill="#1f2328">new max m = 4, so rescale the old sum: 1.368 × e⁽²⁻⁴⁾ = 0.185</text>
  <text x="126" y="230" font-size="12" fill="#1f2328">add this block: e⁽³⁻⁴⁾ + e⁽⁴⁻⁴⁾ = 0.368 + 1 = 1.368</text>
  <text x="126" y="250" font-size="12" font-weight="700" fill="#1f2328">running sum ℓ = 0.185 + 1.368 = 1.553</text>

  <line x1="410" y1="262" x2="410" y2="288" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="422" y="280" font-size="11.5" fill="#555">compare with the full row</text>

  <rect x="110" y="292" width="600" height="60" rx="7" fill="#e6eefb" stroke="#2f74d0" stroke-width="1.6"/>
  <text x="126" y="314" font-size="12.5" font-weight="700" fill="#1f2328">Check: the whole row at once</text>
  <text x="126" y="336" font-size="12" fill="#1f2328">e⁽¹⁻⁴⁾ + e⁽²⁻⁴⁾ + e⁽³⁻⁴⁾ + e⁽⁴⁻⁴⁾ = 0.050 + 0.135 + 0.368 + 1 = 1.553 ✓</text>
</svg>
