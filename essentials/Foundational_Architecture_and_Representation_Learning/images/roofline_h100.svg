<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">H100 roofline: left of the ridge, only moving fewer bytes makes it faster</text>
<text x="20" y="47" font-size="11.5" fill="#666">Best possible speed of an op given its arithmetic intensity. Both axes are log scale. Rough numbers from the table below.</text>
<line x1="90.0" y1="70" x2="90.0" y2="330" stroke="#eeeeea"/>
<text x="90.0" y="347" font-size="11" fill="#666" text-anchor="middle">0.1</text>
<line x1="228.0" y1="70" x2="228.0" y2="330" stroke="#eeeeea"/>
<text x="228.0" y="347" font-size="11" fill="#666" text-anchor="middle">1</text>
<line x1="366.0" y1="70" x2="366.0" y2="330" stroke="#eeeeea"/>
<text x="366.0" y="347" font-size="11" fill="#666" text-anchor="middle">10</text>
<line x1="504.0" y1="70" x2="504.0" y2="330" stroke="#eeeeea"/>
<text x="504.0" y="347" font-size="11" fill="#666" text-anchor="middle">100</text>
<line x1="642.0" y1="70" x2="642.0" y2="330" stroke="#eeeeea"/>
<text x="642.0" y="347" font-size="11" fill="#666" text-anchor="middle">1,000</text>
<line x1="780.0" y1="70" x2="780.0" y2="330" stroke="#eeeeea"/>
<text x="780.0" y="347" font-size="11" fill="#666" text-anchor="middle">10,000</text>
<line x1="90" y1="295.8" x2="780" y2="295.8" stroke="#eeeeea"/>
<text x="82" y="299.8" font-size="11" fill="#666" text-anchor="end">1</text>
<line x1="90" y1="227.4" x2="780" y2="227.4" stroke="#eeeeea"/>
<text x="82" y="231.4" font-size="11" fill="#666" text-anchor="end">10</text>
<line x1="90" y1="159.0" x2="780" y2="159.0" stroke="#eeeeea"/>
<text x="82" y="163.0" font-size="11" fill="#666" text-anchor="end">100</text>
<line x1="90" y1="90.6" x2="780" y2="90.6" stroke="#eeeeea"/>
<text x="82" y="94.6" font-size="11" fill="#666" text-anchor="end">1,000</text>
<line x1="90" y1="330" x2="780" y2="330" stroke="#8a8a82"/>
<text x="435" y="370" font-size="11.5" fill="#555" text-anchor="middle">Arithmetic intensity (FLOPs per byte moved to or from HBM)</text>
<text x="30" y="200" font-size="11.5" fill="#555" text-anchor="middle" transform="rotate(-90 30 200)">Attainable TFLOP/s</text>
<line x1="568.8" y1="90.9" x2="568.8" y2="330" stroke="#8a8a82" stroke-dasharray="4 4"/>
<text x="574.8" y="322" font-size="11.5" fill="#555">ridge ≈ 295</text>
<polyline points="90.0,328.3 568.8,90.9 780,90.9" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="700" y="82.9" font-size="11.5" fill="#1f2328" text-anchor="middle">989 TFLOP/s compute roof</text>
<text x="293.8" y="217.3" font-size="11.5" fill="#1f2328" transform="rotate(-26.4 293.8 217.3)">3.35 TB/s memory roof</text>
<text x="100" y="88" font-size="12.5" font-weight="700" fill="#c0392b">Memory-bound</text>
<text x="100" y="104" font-size="11.5" fill="#555">fuse, batch, quantise</text>
<text x="600" y="250" font-size="12.5" font-weight="700" fill="#2f74d0">Compute-bound</text>
<text x="600" y="266" font-size="11.5" fill="#555">fewer or cheaper FLOPs (FP8)</text>
<circle cx="144.9" cy="301.1" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="154.9" y="319.1" font-size="11.5" fill="#1f2328" text-anchor="start">Elementwise ops ≈ 0.25</text>
<circle cx="228.0" cy="259.9" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="238.0" y="277.9" font-size="11.5" fill="#1f2328" text-anchor="start">Decode, batch 1 ≈ 1</text>
<circle cx="435.7" cy="156.9" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<text x="445.7" y="174.9" font-size="11.5" fill="#1f2328" text-anchor="start">Decode, batch 32 ≈ 32</text>
<circle cx="660.6" cy="90.9" r="6" fill="#2f74d0" stroke="#fff" stroke-width="2"/>
<text x="660.6" y="114.9" font-size="11.5" fill="#1f2328" text-anchor="middle">Training matmul ≈ 1,365</text>
</svg>