<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="330" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">Two ways to remember the past: keep everything, or keep a summary</text>
<text x="20" y="47" font-size="11.5" fill="#666">What each model stores after reading n tokens, and what it must read to produce the next one.</text>
<text x="20" y="84" font-size="13.5" font-weight="700" fill="#1f2328">Attention: KV cache</text>
<text x="430" y="84" font-size="13.5" font-weight="700" fill="#1f2328">Mamba: fixed-size state</text>
<text x="20" y="124" font-size="11.5" fill="#555">n = 2</text>
<rect x="70" y="110" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="94" y="110" width="20" height="20" rx="3" fill="#2f74d0"/>
<text x="126" y="124" font-size="11.5" fill="#1f2328">reads 2</text>
<text x="430" y="124" font-size="11.5" fill="#555">n = 2</text>
<rect x="480" y="110" width="68" height="20" rx="3" fill="#2f74d0" opacity="0.85"/>
<text x="560" y="124" font-size="11.5" fill="#1f2328">reads 1 state, same size every step</text>
<text x="20" y="174" font-size="11.5" fill="#555">n = 4</text>
<rect x="70" y="160" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="94" y="160" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="118" y="160" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="142" y="160" width="20" height="20" rx="3" fill="#2f74d0"/>
<text x="174" y="174" font-size="11.5" fill="#1f2328">reads 4</text>
<text x="430" y="174" font-size="11.5" fill="#555">n = 4</text>
<rect x="480" y="160" width="68" height="20" rx="3" fill="#2f74d0" opacity="0.85"/>
<text x="560" y="174" font-size="11.5" fill="#1f2328">reads 1 state, same size every step</text>
<text x="20" y="224" font-size="11.5" fill="#555">n = 8</text>
<rect x="70" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="94" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="118" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="142" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="166" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="190" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="214" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<rect x="238" y="210" width="20" height="20" rx="3" fill="#2f74d0"/>
<text x="270" y="224" font-size="11.5" fill="#1f2328">reads 8</text>
<text x="430" y="224" font-size="11.5" fill="#555">n = 8</text>
<rect x="480" y="210" width="68" height="20" rx="3" fill="#2f74d0" opacity="0.85"/>
<text x="560" y="224" font-size="11.5" fill="#1f2328">reads 1 state, same size every step</text>
<text x="20" y="270" font-size="11.5" fill="#1f2328">Exact recall of any past token.</text>
<text x="20" y="287" font-size="11.5" fill="#c0392b">Memory and per-step reads grow with n.</text>
<text x="430" y="270" font-size="11.5" fill="#1f2328">Constant cost per token, any length.</text>
<text x="430" y="287" font-size="11.5" fill="#c0392b">Lossy: weaker at exact copying and lookup.</text>
<text x="20" y="316" font-size="11.5" fill="#666">Hybrids (Jamba) mix the two: mostly state layers, a few attention layers for exact recall.</text>
</svg>