<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="410" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">Nine papers, five ideas: each paper is one answer to a shared problem</text>
<text x="20" y="47" font-size="11.5" fill="#666">A filled dot means the paper gives its own answer to that problem. The last column says where this page uses the idea.</text>
<text x="330" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 330 122)">Transformer</text>
