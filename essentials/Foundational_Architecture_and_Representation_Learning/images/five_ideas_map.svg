<text x="530" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 530 122)">ViT</text>
<text x="580" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 580 122)">Scaling laws</text>
<text x="630" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 630 122)">MoE</text>
<text x="680" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 680 122)">FlashAttention</text>
<text x="730" y="122" font-size="11.5" fill="#1f2328" transform="rotate(-40 730 122)">Mamba</text>
<text x="785" y="122" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">Section</text>
