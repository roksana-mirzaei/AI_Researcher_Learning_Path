<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8b8b0"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">The fused Mamba scan never writes the expanded state to HBM</text>
  <text x="20" y="47" font-size="11.5" fill="#666">The state h has shape (batch, length, D, N): N times bigger than the input. In the example, about 268 MB per layer.</text>

  <!-- Naive scan -->
  <text x="20" y="80" font-size="13" font-weight="700" fill="#1f2328">Naive scan</text>
  <rect x="20" y="90" width="380" height="56" rx="7" fill="#fff" stroke="#c8c8c0"/>
  <text x="34" y="112" font-size="12.5" font-weight="700" fill="#1f2328">HBM: big and slow</text>
  <text x="34" y="132" font-size="12" fill="#c0392b">holds x, Δ, A, B, C, y and the full state h</text>
  <line x1="45" y1="146" x2="45" y2="214" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="375" y1="214" x2="375" y2="148" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="210" y="172" font-size="12" fill="#1f2328" text-anchor="middle">read Δ, A, B, C</text>
  <text x="210" y="190" font-size="12" fill="#c0392b" text-anchor="middle">write full state h (N× bigger)</text>
  <text x="210" y="208" font-size="12" fill="#c0392b" text-anchor="middle">read h back → write y</text>
  <rect x="20" y="216" width="380" height="104" rx="7" fill="#fff" stroke="#c8c8c0"/>
  <text x="34" y="238" font-size="12.5" font-weight="700" fill="#1f2328">SRAM: on-chip, fast, tiny</text>
  <text x="34" y="258" font-size="12" fill="#1f2328">discretise: Ā = exp(ΔA), B̄</text>
  <text x="34" y="276" font-size="12" fill="#1f2328">run the recurrence</text>
  <text x="34" y="294" font-size="12" fill="#1f2328">full state h stored in HBM, then read back</text>
  <text x="34" y="311" font-size="11" fill="#555">memory traffic grows with N</text>

  <!-- Fused scan -->
  <text x="420" y="80" font-size="13" font-weight="700" fill="#1f2328">Mamba: fused selective scan</text>
  <rect x="420" y="90" width="380" height="56" rx="7" fill="#fff" stroke="#c8c8c0"/>
  <text x="434" y="112" font-size="12.5" font-weight="700" fill="#1f2328">HBM: big and slow</text>
  <text x="434" y="132" font-size="12" fill="#1f2328">holds x, Δ, A, B, C, y only</text>
  <line x1="445" y1="146" x2="445" y2="214" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="775" y1="214" x2="775" y2="148" stroke="#b8b8b0" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="610" y="178" font-size="12" fill="#1f2328" text-anchor="middle">read Δ, A, B, C once</text>
  <text x="610" y="196" font-size="12" fill="#1f2328" text-anchor="middle">write only y, never h</text>
  <rect x="420" y="216" width="380" height="104" rx="7" fill="#e6eefb" stroke="#2f74d0" stroke-width="1.6"/>
  <text x="434" y="238" font-size="12.5" font-weight="700" fill="#1f2328">SRAM: one fused kernel</text>
  <text x="434" y="258" font-size="12" fill="#1f2328">discretise: Ā = exp(ΔA), B̄</text>
  <text x="434" y="276" font-size="12" fill="#1f2328">parallel scan over the sequence</text>
  <text x="434" y="294" font-size="12" fill="#1f2328">h stays here, never written out</text>
  <text x="434" y="311" font-size="11" fill="#555">backward pass recomputes h instead of storing it</text>
</svg>
