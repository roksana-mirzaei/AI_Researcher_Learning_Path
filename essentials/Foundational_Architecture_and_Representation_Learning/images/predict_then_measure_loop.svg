<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a82"/></marker></defs>
<rect width="820" height="260" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">From reading a paper to running the right experiment</text>
<text x="20" y="47" font-size="11.5" fill="#666">Write the prediction down before you run anything. A surprise is the part worth learning.</text>
<rect x="20" y="72" width="178" height="92" rx="8" fill="#fff" stroke="#c8c8c0" stroke-width="1.5"/>
<text x="34" y="98" font-size="13" font-weight="700" fill="#1f2328">1. Name the idea</text>
<text x="34" y="122" font-size="11.5" fill="#1f2328">Which of the five</text>
<text x="34" y="139" font-size="11.5" fill="#1f2328">problems does it solve?</text>
<line x1="200" y1="118" x2="218" y2="118" stroke="#8a8a82" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="222" y="72" width="178" height="92" rx="8" fill="#e6eefb" stroke="#2f74d0" stroke-width="1.5"/>
<text x="236" y="98" font-size="13" font-weight="700" fill="#1f2328">2. Predict</text>
<text x="236" y="122" font-size="11.5" fill="#1f2328">Cost, behaviour, and</text>
<text x="236" y="139" font-size="11.5" fill="#1f2328">where it will break</text>
<line x1="402" y1="118" x2="420" y2="118" stroke="#8a8a82" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="424" y="72" width="178" height="92" rx="8" fill="#fff" stroke="#c8c8c0" stroke-width="1.5"/>
<text x="438" y="98" font-size="13" font-weight="700" fill="#1f2328">3. Design the test</text>
<text x="438" y="122" font-size="11.5" fill="#1f2328">The cheapest run that</text>
<text x="438" y="139" font-size="11.5" fill="#1f2328">could prove you wrong</text>
<line x1="604" y1="118" x2="622" y2="118" stroke="#8a8a82" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="626" y="72" width="178" height="92" rx="8" fill="#fff" stroke="#c8c8c0" stroke-width="1.5"/>
<text x="640" y="98" font-size="13" font-weight="700" fill="#1f2328">4. Measure</text>
<text x="640" y="122" font-size="11.5" fill="#1f2328">Compare against</text>
<text x="640" y="139" font-size="11.5" fill="#1f2328">the prediction</text>
<path d="M715,164 V210 H109 V170" fill="none" stroke="#8a8a82" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="412" y="230" font-size="11.5" fill="#555" text-anchor="middle">Prediction held: trust the idea more. It failed: the paper did something new, so read that part again.</text>
</svg>