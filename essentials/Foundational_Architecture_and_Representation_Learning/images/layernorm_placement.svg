<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a82"/></marker></defs>
<rect width="820" height="430" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">Where the norm sits decides whether the residual stream stays clean</text>
<text x="20" y="47" font-size="11.5" fill="#666">Thick line = the residual stream (skip connection). Right-hand branch = the block F (attention or FFN). Orange = a norm.</text>
<text x="20" y="80" font-size="13.5" font-weight="700" fill="#1f2328">Post-LN</text>
<text x="20" y="97" font-size="11.5" fill="#666">Transformer 2017, BERT</text>
<text x="80" y="122" font-size="12" fill="#1f2328" text-anchor="middle">x_l</text>
<line x1="80" y1="128" x2="80" y2="268" stroke="#2f74d0" stroke-width="4"/>
<line x1="80" y1="145" x2="185" y2="145" stroke="#8a8a82" stroke-width="1.3"/>
<line x1="185" y1="145" x2="185" y2="160" stroke="#8a8a82" stroke-width="1.3"/>
