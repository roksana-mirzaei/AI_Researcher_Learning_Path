<rect x="35" y="304" width="90" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="80.0" y="322.0" font-size="12" fill="#1f2328" text-anchor="middle">norm</text>
<line x1="80" y1="332" x2="80" y2="350" stroke="#c0392b" stroke-width="4"/>
<text x="80" y="366" font-size="12" fill="#1f2328" text-anchor="middle">x_l+1</text>
<text x="20" y="394" font-size="11.5" fill="#1f2328">The norm sits on the stream itself.</text>
<text x="20" y="411" font-size="11.5" fill="#1f2328">Needs LR warmup; fragile when deep.</text>
<text x="290" y="80" font-size="13.5" font-weight="700" fill="#1f2328">Pre-LN</text>
<text x="290" y="97" font-size="11.5" fill="#666">GPT-2, GPT-3, LLaMA</text>
